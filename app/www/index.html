<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Open Games · 游戏库</title>
<meta name="description" content="飞牛 fnOS 本地游戏库：开源 3D 网页游戏合集，点开即玩。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d1117'/%3E%3Cpath d='M20 24h24l6 16-8 4-4-4H26l-4 4-8-4z' fill='%235ec8ff'/%3E%3Ccircle cx='26' cy='32' r='3' fill='%230d1117'/%3E%3Ccircle cx='38' cy='32' r='3' fill='%230d1117'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #080b10;
    --bg-2: #0d1219;
    --panel: #12171f;
    --panel-2: #171d27;
    --line: rgba(255, 255, 255, .07);
    --line-strong: rgba(255, 255, 255, .14);
    --text: #e8eef6;
    --dim: #8d9bae;
    --accent: #5ec8ff;
    --accent-2: #7c8cff;
    --ok: #4ade80;
    --radius: 16px;
    --shadow: 0 18px 50px rgba(0, 0, 0, .55);
    --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(1200px 600px at 12% -8%, rgba(94, 200, 255, .16), transparent 60%),
      radial-gradient(900px 520px at 92% 0%, rgba(124, 140, 255, .14), transparent 60%),
      linear-gradient(180deg, #0a0e14 0%, #080b10 40%, #06090d 100%);
    background-attachment: fixed;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px clamp(16px, 4vw, 48px);
    background: rgba(8, 11, 16, .78);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-bottom: 1px solid var(--line);
  }

  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .brand-mark {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 11px;
    background: linear-gradient(145deg, #1b2532, #10151d);
    border: 1px solid var(--line-strong);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    flex: none;
  }
  .brand-mark svg { width: 21px; height: 21px; fill: var(--accent); }

  .brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .brand-text b { font-size: 15px; letter-spacing: .18em; font-weight: 700; white-space: nowrap; }
  .brand-text span { font-size: 11px; color: var(--dim); letter-spacing: .08em; }

  .search {
    margin-left: auto;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search svg {
    position: absolute; left: 11px; width: 15px; height: 15px;
    fill: none; stroke: var(--dim); stroke-width: 2;
    pointer-events: none;
  }
  .search input {
    width: clamp(140px, 26vw, 260px);
    padding: 9px 12px 9px 33px;
    font-size: 13px;
    color: var(--text);
    background: rgba(255, 255, 255, .05);
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: border-color .18s, background .18s, width .18s;
  }
  .search input::placeholder { color: #6b7787; }
  .search input:focus { border-color: rgba(94, 200, 255, .55); background: rgba(94, 200, 255, .07); }

  .count {
    font-size: 12px;
    color: var(--dim);
    padding: 6px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    white-space: nowrap;
  }

  /* ---------- 精选横幅 ---------- */
  .wrap { padding: 0 clamp(16px, 4vw, 48px) 64px; max-width: 1560px; margin: 0 auto; }

  .hero {
    position: relative;
    margin-top: 22px;
    border-radius: 22px;
    overflow: hidden;
    min-height: clamp(240px, 34vw, 400px);
    display: flex;
    align-items: flex-end;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    isolation: isolate;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center 22%;
    transform: scale(1.02);
    transition: transform 1.2s cubic-bezier(.2, .8, .2, 1);
    z-index: -2;
  }
  .hero:hover .hero-bg { transform: scale(1.06); }
  .hero::after {
    content: "";
    position: absolute; inset: 0; z-index: -1;
    background:
      linear-gradient(90deg, rgba(6, 9, 13, .93) 0%, rgba(6, 9, 13, .72) 34%, rgba(6, 9, 13, .1) 62%, rgba(6, 9, 13, .22) 100%),
      linear-gradient(0deg, rgba(6, 9, 13, .82) 0%, transparent 46%);
  }
  .hero-body {
    position: relative;
    padding: clamp(20px, 3.4vw, 40px);
    max-width: 660px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; letter-spacing: .2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .eyebrow::before {
    content: ""; width: 22px; height: 1px; background: currentColor; opacity: .7;
  }
  .hero h1 {
    margin: 0 0 10px;
    font-size: clamp(26px, 3.6vw, 46px);
    line-height: 1.1;
    letter-spacing: -.01em;
  }
  .hero p {
    margin: 0 0 18px;
    font-size: clamp(13px, 1.15vw, 15px);
    line-height: 1.75;
    color: #b9c5d4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  .pills { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
  .pill {
    font-size: 11.5px;
    color: #cfdae7;
    padding: 4px 10px;
    border-radius: 7px;
    background: rgba(255, 255, 255, .08);
    border: 1px solid var(--line);
    letter-spacing: .04em;
  }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 11px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .16s, filter .16s, background .16s, border-color .16s;
  }
  .btn svg { width: 15px; height: 15px; fill: currentColor; }
  .btn-primary {
    color: #04121c;
    background: linear-gradient(135deg, #7bd7ff, #4bb4ee 55%, #3e9ed8);
    box-shadow: 0 10px 26px rgba(72, 168, 220, .32);
  }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.07); }
  .btn-ghost {
    color: var(--text);
    background: rgba(255, 255, 255, .06);
    border-color: var(--line-strong);
    backdrop-filter: blur(6px);
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .24); }

  /* ---------- 工具条 ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 30px 0 18px;
  }
  .toolbar h2 {
    margin: 0;
    font-size: 17px;
    letter-spacing: .04em;
    font-weight: 650;
  }
  .toolbar h2 small { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; letter-spacing: .06em; }

  .chips { display: flex; gap: 7px; margin-left: auto; flex-wrap: wrap; }
  .chip {
    padding: 7px 14px;
    font-size: 12.5px;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: color .16s, border-color .16s, background .16s;
  }
  .chip:hover { color: var(--text); border-color: var(--line-strong); }
  .chip.on {
    color: #06131c;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  /* ---------- 游戏卡片 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: clamp(14px, 1.6vw, 22px);
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform .22s cubic-bezier(.2, .8, .2, 1), border-color .22s, box-shadow .22s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: rgba(94, 200, 255, .38);
    box-shadow: 0 22px 46px rgba(0, 0, 0, .5), 0 0 0 1px rgba(94, 200, 255, .14);
    outline: none;
  }

  .card-media {
    position: relative;
    aspect-ratio: 16 / 9.6;
    overflow: hidden;
    background: #0b0f15;
  }
  .card-media img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .5s cubic-bezier(.2, .8, .2, 1), filter .3s;
    filter: saturate(1.02);
  }
  .card:hover .card-media img { transform: scale(1.055); filter: saturate(1.12) brightness(1.04); }

  .card-shade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 42%, rgba(9, 12, 17, .78) 100%);
  }

  .badge-recent {
    position: absolute; top: 10px; left: 10px;
    font-size: 11px;
    letter-spacing: .06em;
    color: #06131c;
    background: var(--ok);
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 700;
  }

  .play-float {
    position: absolute;
    right: 12px; bottom: 12px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(94, 200, 255, .95);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px) scale(.9);
    transition: opacity .2s, transform .2s, filter .2s;
  }
  .play-float:hover { filter: brightness(1.1); }
  .play-float:focus-visible { opacity: 1; transform: none; outline: 2px solid #fff; outline-offset: 2px; }
  .play-float svg { width: 16px; height: 16px; fill: #04121c; margin-left: 2px; }
  .card:hover .play-float, .card:focus-visible .play-float { opacity: 1; transform: translateY(0) scale(1); }

  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 9px; flex: 1; }

  .card-title-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .card-title {
    margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .01em;
    flex: 0 0 auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-en {
    flex: 1 1 auto; min-width: 0;
    font-size: 11px; color: #6f7c8d; letter-spacing: .08em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .card-desc {
    margin: 0;
    font-size: 12.8px;
    line-height: 1.7;
    color: #9fadbe;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 44px;
  }

  .card-meta {
    margin-top: auto;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .keyline {
    font-size: 11.5px;
    color: #7d8b9d;
    letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .cat { font-size: 11.5px; color: #93a1b3; white-space: nowrap; }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: #43505f; flex: none; }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--dim);
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    font-size: 14px;
  }

  /* ---------- 详情弹窗 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 90;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(4, 6, 10, .72);
    backdrop-filter: blur(8px);
  }
  .modal.open { display: flex; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .sheet {
    width: min(760px, 100%);
    max-height: 88vh;
    overflow: auto;
    background: #0f141c;
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .7);
    animation: rise .22s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes rise { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }

  .sheet-media { position: relative; aspect-ratio: 16 / 7; overflow: hidden; }
  .sheet-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sheet-media::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, #0f141c 100%);
  }
  .sheet-close {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border-radius: 50%;
    color: var(--text);
    background: rgba(0, 0, 0, .55);
    border: 1px solid var(--line-strong);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }
  .sheet-close:hover { background: rgba(0, 0, 0, .8); }

  .sheet-body { padding: 0 clamp(18px, 3vw, 30px) clamp(20px, 3vw, 28px); margin-top: -26px; position: relative; }
  .sheet-body h3 { margin: 0 0 6px; font-size: clamp(20px, 2.6vw, 27px); }
  .sheet-body .long { margin: 12px 0 18px; font-size: 13.5px; line-height: 1.85; color: #a9b6c6; }
  .sheet-body .long p { margin: 0 0 9px; }
  .sheet-body .long p:last-child { margin-bottom: 0; }

  .sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .key-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 12px;
    font-size: 12.5px;
    color: #c3cedb;
    background: rgba(255, 255, 255, .04);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .key-item kbd {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    color: #eaf4ff;
    background: #1c2531;
    border: 1px solid rgba(255, 255, 255, .16);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  footer {
    margin-top: 46px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #6d7a8b;
  }
  footer .links { display: flex; gap: 16px; flex-wrap: wrap; }
  footer a:hover { color: var(--accent); }

  @media (max-width: 720px) {
    .topbar { gap: 10px; padding: 10px 14px; }
    .brand-text span { display: none; }
    .brand-text b { font-size: 13.5px; letter-spacing: .14em; }
    .search { flex: 1 1 auto; min-width: 0; }
    .search input { width: 100%; }
    .count { display: none; }
    .wrap { padding: 0 14px 48px; }
    /* 移动端改为「图片在上、文案在下」，避免文字压在封面主体上 */
    .hero { display: block; min-height: 0; }
    .hero::after { display: none; }
    .hero-bg {
      position: relative; inset: auto;
      height: 168px;
      background-position: 72% 24%;
      transform: none;
    }
    .hero:hover .hero-bg { transform: none; }
    .hero-body {
      padding: 16px 16px 18px;
      max-width: none;
      background: linear-gradient(180deg, #10161f, #0c121a 70%, #0a0f16);
      border-top: 1px solid var(--line);
    }
    .hero h1 { font-size: 26px; }
    .hero p { -webkit-line-clamp: 4; }
    .grid { grid-template-columns: 1fr; }
    .chips { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 6h9c2.9 0 4.6 2.2 5.3 5.6l.9 4.3c.4 1.9-.9 3.6-2.8 3.6-1 0-1.9-.5-2.5-1.3L16 16.5H8L6.6 18.2c-.6.8-1.5 1.3-2.5 1.3-1.9 0-3.2-1.7-2.8-3.6l.9-4.3C2.9 8.2 4.6 6 7.5 6Zm.8 2.2c-1.7 0-2.7 1.2-3.2 3.3l-.6 2.6c-.1.5.2 1 .7 1 .3 0 .5-.1.7-.4l1.3-1.6h9.6l1.3 1.6c.2.3.4.4.7.4.5 0 .8-.5.7-1l-.6-2.6c-.5-2.1-1.5-3.3-3.2-3.3H8.3Zm-.6 2.6a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm8.6 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>
    </span>
    <span class="brand-text">
      <b>OPEN GAMES</b>
      <span>本地游戏库 · 打开即玩</span>
    </span>
  </div>

  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="q" type="search" placeholder="搜索游戏、类型…" autocomplete="off" />
  </label>

  <span class="count" id="count">6 款游戏</span>
</header>

<main class="wrap">
  <section class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-body">
      <div class="eyebrow">精选推荐</div>
      <h1 id="heroTitle"></h1>
      <div class="pills" id="heroPills"></div>
      <p id="heroDesc"></p>
      <div class="actions">
        <button class="btn btn-primary" id="heroPlay">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.1v13.8c0 .8.9 1.3 1.6.9l10.4-6.9c.6-.4.6-1.4 0-1.8L9.6 4.2C8.9 3.8 8 4.3 8 5.1Z"/></svg>
          开始游戏
        </button>
        <button class="btn btn-ghost" id="heroInfo">查看详情</button>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <h2>全部游戏 <small id="gridCount"></small></h2>
    <div class="chips" id="chips"></div>
  </div>

  <section class="grid" id="grid"></section>

  <footer>
    <span id="footLeft">运行于本机服务的飞牛 fnOS 游戏库 · 全部游戏离线可玩，无需外网</span>
    <span class="links">
      <a href="https://github.com/HWYWL/Open-Games" target="_blank" rel="noopener noreferrer">开源地址</a>
      <a href="/healthz" target="_blank" rel="noopener">服务状态</a>
    </span>
  </footer>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <div class="sheet-media">
      <img id="sheetImg" alt="" />
      <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body">
      <h3 id="sheetTitle"></h3>
      <div class="pills" id="sheetPills"></div>
      <div class="long" id="sheetDesc"></div>
      <div class="keys" id="sheetKeys"></div>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="sheetPlay">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.1v13.8c0 .8.9 1.3 1.6.9l10.4-6.9c.6-.4.6-1.4 0-1.8L9.6 4.2C8.9 3.8 8 4.3 8 5.1Z"/></svg>
          开始游戏
        </button>
        <a class="btn btn-ghost" id="sheetRepo" href="#" target="_blank" rel="noopener noreferrer">

  var RECENT_KEY = "og.recent.v1";
  var gridEl = document.getElementById("grid");
  var chipsEl = document.getElementById("chips");
  var qEl = document.getElementById("q");
  var countEl = document.getElementById("count");
  var gridCountEl = document.getElementById("gridCount");
  var modal = document.getElementById("modal");
  var current = { filter: "全部", q: "", sheetGame: null };

  function readRecent() {
    try {
      var raw = localStorage.getItem(RECENT_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function markPlayed(id) {
    try {
      var r = readRecent();
      r[id] = Date.now();
      localStorage.setItem(RECENT_KEY, JSON.stringify(r));
    } catch (e) {}
  }

  // 只在新标签页打开游戏：用 <a target="_blank"> 触发，
  // 不用 window.open(...) + 兜底跳转（带 noopener 的 window.open 会返回 null，
  // 旧逻辑会误判为"被拦截"从而让面板自身也跳转，导致同时打开两处）
  function play(game) {
    markPlayed(game.id);
    var a = document.createElement("a");
    a.href = game.href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    render();
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function match(game) {
    if (current.filter !== "全部" && game.category !== current.filter) return false;
    if (!current.q) return true;
    var hay = (game.title + " " + game.en + " " + game.tags.join(" ") + " " + game.short).toLowerCase();
    return hay.indexOf(current.q.toLowerCase()) > -1;
  }

  function renderChips() {
    var cats = ["全部"];
    GAMES.forEach(function (g) { if (cats.indexOf(g.category) < 0) cats.push(g.category); });
    chipsEl.innerHTML = cats.map(function (c) {
      return '<button class="chip' + (c === current.filter ? " on" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + "</button>";
    }).join("");
  }

  function renderGrid() {
    var recent = readRecent();
    var list = GAMES.filter(match).sort(function (a, b) {
      return (recent[b.id] || 0) - (recent[a.id] || 0);
    });

    gridCountEl.textContent = list.length + " / " + GAMES.length;

    if (!list.length) {
      gridEl.innerHTML = '<div class="empty">没有找到匹配的游戏，换个关键词试试。</div>';
      return;
    }

    gridEl.innerHTML = list.map(function (g) {
      var isRecent = !!recent[g.id];
      return (
        '<article class="card" data-id="' + esc(g.id) + '" tabindex="0" role="button" aria-label="查看详情：' + esc(g.title) + '">' +
          '<div class="card-media">' +
            '<img src="' + esc(g.cover) + '" alt="' + esc(g.title) + ' 封面" loading="lazy" />' +
            '<div class="card-shade"></div>' +
            (isRecent ? '<span class="badge-recent">最近游玩</span>' : "") +
            '<button class="play-float" type="button" data-play="1" aria-label="开始游戏：' + esc(g.title) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.1v13.8c0 .8.9 1.3 1.6.9l10.4-6.9c.6-.4.6-1.4 0-1.8L9.6 4.2C8.9 3.8 8 4.3 8 5.1Z"/></svg></button>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-title-row"><h3 class="card-title">' + esc(g.title) + '</h3><span class="card-en">' + esc(g.en) + '</span></div>' +
            '<p class="card-desc">' + esc(g.short) + '</p>' +
            '<div class="card-meta">' +
              '<span class="keyline">' + esc(g.keys[0][0] + " " + g.keys[0][1]) + "</span>" +
              '<span class="dot"></span>' +
              '<span class="cat">' + esc(g.category) + "</span>" +
            '</div>' +
          '</div>' +
        '</article>'
      );
    }).join("");
  }

  function renderHero() {
    var g = GAMES.filter(function (x) { return x.featured; })[0] || GAMES[0];
    document.getElementById("heroBg").style.backgroundImage = 'url("' + (g.hero || g.cover) + '")';
    document.getElementById("heroTitle").textContent = g.title;
    document.getElementById("heroDesc").textContent = g.short;
    document.getElementById("heroPills").innerHTML = g.tags.map(function (t) {
      return '<span class="pill">' + esc(t) + "</span>";
    }).join("");
    document.getElementById("heroPlay").onclick = function () { play(g); };
    document.getElementById("heroInfo").onclick = function () { openSheet(g); };
  }

  function render() {
    renderChips();
    renderGrid();
    countEl.textContent = GAMES.length + " 款游戏";
  }

  function openSheet(g) {
    current.sheetGame = g;
    document.getElementById("sheetImg").src = g.cover;
    document.getElementById("sheetImg").alt = g.title + " 封面";
    document.getElementById("sheetTitle").textContent = g.title;
    document.getElementById("sheetPills").innerHTML = g.tags.map(function (t) {
      return '<span class="pill">' + esc(t) + "</span>";
    }).join("");
    document.getElementById("sheetDesc").innerHTML = g.long.split("\n").map(function (para) {
      return "<p>" + esc(para) + "</p>";
    }).join("");
    document.getElementById("sheetKeys").innerHTML = g.keys.map(function (k) {
      return '<div class="key-item"><kbd>' + esc(k[0]) + "</kbd>" + esc(k[1]) + "</div>";
    }).join("");
    document.getElementById("sheetPlay").onclick = function () {
      closeSheet();
      play(g);
    };
    var repoEl = document.getElementById("sheetRepo");
    if (g.repo) {
      repoEl.href = g.repo;
      repoEl.style.display = "";
    } else {
      repoEl.style.display = "none";
    }
    modal.classList.add("open");
  }

  function closeSheet() {
    modal.classList.remove("open");
    current.sheetGame = null;
  }

  gridEl.addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (!card) return;
    var g = GAMES.filter(function (x) { return x.id === card.dataset.id; })[0];
    if (!g) return;
    // 点封面上的播放按钮才直接开玩，其余区域点击打开详情
    if (e.target.closest("[data-play]")) play(g);
    else openSheet(g);
  });

  gridEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var card = e.target.closest(".card");
    if (!card) return;
    e.preventDefault();
    var g = GAMES.filter(function (x) { return x.id === card.dataset.id; })[0];
    if (!g) return;
    if (e.target.closest("[data-play]")) play(g);
    else openSheet(g);
  });

  gridEl.addEventListener("contextmenu", function (e) {
    var card = e.target.closest(".card");
    if (!card) return;
    e.preventDefault();
    var g = GAMES.filter(function (x) { return x.id === card.dataset.id; })[0];
    if (g) openSheet(g);
  });

  chipsEl.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    current.filter = chip.dataset.cat;
    render();
  });

  qEl.addEventListener("input", function () {
    current.q = qEl.value.trim();
    renderGrid();
  });

  document.getElementById("sheetClose").onclick = closeSheet;
  modal.addEventListener("click", function (e) { if (e.target === modal) closeSheet(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && modal.classList.contains("open")) closeSheet();
    if (e.key === "/" && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
  });

  renderHero();
  render();
})();
</script>
</body>
</html>
